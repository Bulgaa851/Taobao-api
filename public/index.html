<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Монгол Дэлгүүр — Taobao</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-red-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <h1 class="text-2xl font-bold tracking-tight whitespace-nowrap">🛍️ Монгол Дэлгүүр</h1>
      <div class="flex-1 flex gap-2">
        <input
          id="searchInput"
          type="text"
          placeholder="Бүтээгдэхүүн хайх (Монгол эсвэл Хятад)..."
          class="flex-1 rounded-lg px-4 py-2 text-gray-900 text-sm outline-none"
        />
        <button
          id="searchBtn"
          class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-semibold px-5 py-2 rounded-lg transition"
        >
          Хайх
        </button>
      </div>
    </div>
  </header>

  <!-- Category Filter -->
  <div class="max-w-7xl mx-auto px-4 py-3 flex gap-2 overflow-x-auto" id="categories">
    <button class="category-btn active" data-cat="">Бүгд</button>
    <button class="category-btn" data-cat="clothing">Хувцас</button>
    <button class="category-btn" data-cat="electronics">Электроник</button>
    <button class="category-btn" data-cat="home">Гэр ахуй</button>
    <button class="category-btn" data-cat="beauty">Гоо сайхан</button>
    <button class="category-btn" data-cat="sports">Спорт</button>
  </div>

  <!-- Status / Loading -->
  <div id="statusMsg" class="max-w-7xl mx-auto px-4 py-2 text-sm text-gray-500 hidden"></div>

  <!-- Product Grid -->
  <main class="max-w-7xl mx-auto px-4 py-4">
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
    </div>
    <div id="emptyState" class="text-center py-20 text-gray-400 hidden">
      <p class="text-5xl mb-4">🔍</p>
      <p class="text-lg">Бүтээгдэхүүн олдсонгүй</p>
      <p class="text-sm mt-1">Дээрх хайлтыг ашиглан Taobao-оос татна уу</p>
    </div>
    <div id="loadingState" class="text-center py-20 text-gray-400">
      <div class="inline-block w-10 h-10 border-4 border-red-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-3 text-sm">Ачааллаж байна...</p>
    </div>
  </main>

  <!-- Pagination -->
  <div id="pagination" class="max-w-7xl mx-auto px-4 pb-10 flex justify-center gap-2 hidden">
    <button id="prevBtn" class="px-4 py-2 bg-white border rounded-lg text-sm hover:bg-gray-50 disabled:opacity-40">← Өмнөх</button>
    <span id="pageInfo" class="px-4 py-2 text-sm text-gray-600"></span>
    <button id="nextBtn" class="px-4 py-2 bg-white border rounded-lg text-sm hover:bg-gray-50 disabled:opacity-40">Дараах →</button>
  </div>

  <!-- Product Modal -->
  <div id="modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="p-5">
        <div class="flex justify-between items-start mb-4">
          <h2 id="modalTitle" class="text-lg font-bold text-gray-900 leading-tight flex-1 pr-3"></h2>
          <button id="modalClose" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">✕</button>
        </div>
        <img id="modalImage" src="" alt="" class="w-full rounded-xl mb-4 object-cover max-h-72" />
        <p id="modalOrigTitle" class="text-xs text-gray-400 mb-3"></p>
        <div class="flex items-center justify-between mb-3">
          <span id="modalPrice" class="text-2xl font-bold text-red-600"></span>
          <span id="modalSold" class="text-sm text-gray-500"></span>
        </div>
        <p id="modalShop" class="text-sm text-gray-500 mb-4"></p>
        <a id="modalLink" href="#" target="_blank" rel="noopener"
           class="block w-full text-center bg-red-600 hover:bg-red-500 text-white font-semibold py-3 rounded-xl transition">
          Taobao дээр үзэх →
        </a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
